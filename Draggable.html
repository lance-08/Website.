<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>
    <link rel="stylesheet" href="dragStyle.css">
    <script src="dragScript.js" defer></script>

</head>
<body>
    <center>
        <h1>Drag And Drop API</h1>
    </center>
    <div class = "draggableContainer">
        <div class ="box" draggable="true" id="box">Draggable 1</div>
        <div class ="box" draggable="true" id="box">Draggable 2</div>
        <div class ="box" draggable="true" id="box">Draggable 3</div>
        <div class ="box" draggable="true" id="box">Draggable 4</div>
        <div class ="box" draggable="true" id="box">Draggable 5</div>
        <div class ="box" draggable="true" id="box">Draggable 6</div>
        <div class ="box" draggable="true" id="box">Draggable 7</div>
        <div class ="box" draggable="true" id="box">Draggable 8</div>
        <div class ="box" draggable="true" id="box">Draggable 9</div>
        <div class ="box" draggable="true" id="box">Draggable 10</div>
    </div>
        <div class = "droppableContainer">
        <div class ="droppable"  data-draggable-id  id="box">Droppable 1</div>
        <div class ="droppable"  data-draggable-id  id="box">Droppable 2</div>
        <div class ="droppable"  data-draggable-id  id="box">Droppable 3</div>
        <div class ="droppable"  data-draggable-id  id="box">Droppable 4</div>
        <div class ="droppable"  data-draggable-id  id="box">Droppable 5</div>
        <div class ="droppable"  data-draggable-id  id="box">Droppable 6</div>
        <div class ="droppable"  data-draggable-id  id="box">Droppable 7</div>
        <div class ="droppable"  data-draggable-id  id="box">Droppable 8</div>
        <div class ="droppable"  data-draggable-id  id="box">Droppable 9</div>
        <div class ="droppable"  data-draggable-id  id="box">Droppable 10</div>
    </div>
    
</body> 
</html>
