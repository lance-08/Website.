<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Grades</title>
</head>

<body>
    <center>

        <h1>Save Grades</h1>
        
        <label>Enter LRN: </label>
        <input type="text" id="txtLRN" name="lrn" maxlength="12"></input>

        <label>Enter Name: </label>
        <input type="text" id="txtName" name="name" maxlength="40"></input>

        <label>Enter Section: </label>
        <input type="text" id="txtSection" name="section" maxlength="10"></input>

        <label>Enter Subject: </label>
        <input type="text" id="txtSubject" name="subject"></input>

        <label>Enter Grades: </label>
        <input type="number" id="txtGrade" name="grade" max="100" maxlength="3"></input>

        <input type="button" id="btnSave" value="Save"></input>


        <p id="message"></p> /*lanz*/
        <br><br>
        <table border="1">
            <thead>
                <tr>
                    <th>LRN</th>
                    <th>Name</th>
                    <th>Section</th>
                    <th>Subject</th>
                    <th>Grades</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </center>
    <script>
        /*STEP 2 */
        var txtLRN = document.getElementById("txtLRN");
        var txtName = document.getElementById("txtName");
        var txtSection = document.getElementById("txtSection");
        var txtSubject = document.getElementById("txtSubject");
        var txtGrade = document.getElementById("txtGrade");
        var btnSave = document.getElementById("btnSave");
        var message = document.getElementById("message");
        var tableBody = document.getElementById("tableBody");

        var grades = JSON.parse(localStorage.getItem("grades")) || [];

        var selectedIndex = -1;

        /*STEP 3 */

        function showGrades (){
            tableBody.textContent = "";
            for (var i = 0; i < grades.length; i++) {
                var row = tableBody.insertRow();
                row.insertCell().textContent = grades[i].lrn;
                row.insertCell().textContent = grades[i].name;
                row.insertCell().textContent = grades[i].section;
                row.insertCell().textContent = grades[i].subject;
                row.insertCell().textContent = grades[i].grade;

                var actionCell =row.insertCell();
                actionCell.appendChild(makeUpdateButton(i));
                actionCell.appendChild(makeDeleteButton(i));
            }
        }

        /*STEP 4 */

        function makeUpdateButton(index) {
            var button =document.createElement("button");

            button.textContent = "Update";

            button.addEventListener("click", function () {
                loadForUpdate(index);
            });
            return button;
        }

        function loadForUpdate(index){
            selectedIndex = index;

            txtLRN.value = grades[index].lrn;
            txtName.value = grades[index].name;
            txtSection.value = grades[index].section;
            txtSubject.value = grades[index].subject;
            txtGrade.value = grades[index].grade;

            btnSave.value = "Update";
            message.textContent = "Change the values, then click the Update button above the table. ";
        }

        function makeDeleteButton(index){
            var deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener("click", function() {
                deleteGrade(index);
            });
            return deleteButton;
        }

        function deleteGrade(index) {
            var sure = confirm("Delete the record of " + grades[index].name + "?");
            if (!sure) {
                return;
            }
            grades.splice(index, 1);

            if (selectedIndex === index) {

                selectedIndex = -1;
                btnSave.value = "Save";
                txtLRN.value = "";
                txtName.value = "";
                txtSection.value = "";
                txtSubject.value = "";
                txtGrade.value = "";
            } else if (selectedIndex > index) {
                selectedIndex = selectedIndex -1;
            }

        localStorage.setItem("grades", JSON.stringify(grades));
        message.textContent = "Deleted";
        showGrades();
        }

        function saveGrades() {
            var lrn = txtLRN.value.trim();
            var name = txtName.value.trim();
            var section = txtSection.value.trim();
            var subject = txtSubject.value.trim();
            var grade = txtGrade.value.trim();

            if (lrn === "" || name === "" || section === "" || subject === "" || grade === "") {
                message.textContent = "Please fill in all fields.";
                return;
            }

            var record = { 
                lrn: lrn,
                name: name,
                section: section,
                subject: subject,
                grade: grade
            };

            if (selectedIndex === -1) {
                grades.push(record);
                message.textContent = "Saved!";
            } else {
                grades[selectedIndex] = record;
                message.textContent = "Updated";
                selectedIndex = -1;
                btnSave.value = "Save";
            }

            localStorage.setItem("grades", JSON.stringify(grades));

            txtLRN.value = "";
            txtName.value = "";
            txtSection.value = "";
            txtSubject.value = "";
            txtGrade.value = "";
            showGrades();
    
        }

        btnSave.addEventListener("click", saveGrades);

        showGrades();

    </script>
</body>

</html>
