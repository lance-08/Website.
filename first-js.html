<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First JavaScript</title>
    <a href="index.html">BACK TO HOME</a>
        <script>
        console.log("Hello World");
        console.log("Lance Kherwin C. Maliksi");

        var a = 10;
        var b = 20;
        var sum = a + b;
        var sub = a - b;
        var prod = a * b;
        var div = a / b;
        var mod = a % b;
        var rg = a < b;
        var lg = a > b;
        var gg = a == b;
        var ga = a != b;
        var gb = a <= b;
        var gq = a >= b;
        var gf = a && b;
        var gy = a || b;
        
        console.log( a + " + " + b + " = " + sum);
        console.log( a + " - " + b + " = " + sub);
        console.log( a + " * " + b + " = " + prod);
        console.log( a + " / " + b + " = " + div);
        console.log( a + " % " + b + " = " + mod);
        console.log( a + " < " + b + " = " + rg);
        console.log( a + " > " + b + " = " + lg);
        console.log( a + " == " + b + " = " + gg);
        console.log( a + " != " + b + " = " + ga);
        console.log( a + " <= " + b + " = " + gb);
        console.log( a + " >= " + b + " = " + gq);
        console.log( a + " && " + b + " = " + gf);
        console.log( a + " && " + b + " = " + gf);
        console.log( a + " || " + b + " = " + gy);
            
    </script>
</head>
<body>
    <h1>JavaScript</h1>
</body>
