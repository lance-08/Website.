<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG to HTML</title>
  <style>
    h2 {
      text-align: center;
      color: aqua;
    }

    .box {
      width: 240px;
      margin: 15px auto;
      border: 2px solid black;
      padding: 10px;
      background-color: white;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .box h4 {
      margin: 5px 0 10px;
    }

    svg {
      display: block;
    }
  </style>
  
</head>

<body>
  <h2>This is SVG Demo</h2>
<a href="portfolio.html">BACK TO PORTFOLIO</a>
  <div class="box">
    <h4>Circle</h4>
    <svg width="70" height="70">
      <circle cx="35" cy="35" r="30" stroke="green" stroke-width="4" fill="yellow" />
    </svg>
  </div>

  <div class="box">
    <h4>Rectangle</h4>
    <svg width="210" height="110">
      <rect x="5" y="5" width="200" height="100" stroke="red" stroke-width="6" fill="blue" />
    </svg>
  </div>

  <div class="box">
    <h4>Star</h4>
    <svg width="200" height="205">
      <polygon points="100,10 40,198 190,78 10,78 160,198"
        style="fill:lime;stroke:purple;stroke-width:5;fill-rule:evenodd;" />
    </svg>
  </div>

  <div class="box">
    <h4>Svg Logo</h4>
    <svg width="180" height="120">
      <defs>
        <linearGradient id="grad1">
          <stop offset="0%" stop-color="yellow" />
          <stop offset="100%" stop-color="red" />
        </linearGradient>
      </defs>
      <ellipse cx="90" cy="60" rx="85" ry="55" fill="url(#grad1)" />
      <text fill="#ffffff" font-size="45" font-family="Verdana" x="42" y="76">SVG</text>
    </svg>
  </div>
</body>

</html>
